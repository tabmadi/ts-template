name: Bug Report
description: Report a bug
labels: ["kind/bug", "status/triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: Use a plain title that names the problem, such as `Console shows a blank page after sign-in`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the behavior that you observed.
      placeholder: The page stays blank after I sign in.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What you expected
      description: Describe the behavior that you expected.
      placeholder: The console opens after I sign in.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: List the steps that make the issue happen again.
      placeholder: |
        1. Go to the page
        2. Click the control
        3. See the error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant log output. It is formatted as code, so do not add backticks.
      render: shell
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add the version, the environment, or other information that helps.
    validations:
      required: false
