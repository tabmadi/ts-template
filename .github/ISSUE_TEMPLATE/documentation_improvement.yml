name: Documentation Improvement
description: Suggest a change to the documentation
labels: ["kind/docs", "status/triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: Use a plain title that names the gap, such as `Setup guide omits the cache variables`.
  - type: textarea
    id: improvement
    attributes:
      label: What needs to improve
      description: Describe the gap, who it affects, and what readers should be able to do.
      placeholder: The setup guide omits a setting that operators need to turn on the cache.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: The URL or file path of the documentation.
      placeholder: README.md or https://github.com/user/repo/blob/main/docs/guide.md
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other information about the change here.
    validations:
      required: false
