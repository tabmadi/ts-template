name: Feature Request
description: Suggest an idea for this project
labels: ["kind/feature", "status/triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: Use a plain title that names the outcome, such as `Operators can export the audit log`.
  - type: input
    id: audience
    attributes:
      label: Who needs this
      description: The person or team that needs the change.
      placeholder: Operators
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem and what it stops them from doing.
      placeholder: Operators cannot keep a copy of the audit log.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What they can do when the change is done.
      placeholder: Operators can download the audit log as a file.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Done when
      description: Describe how to check the result, if you know.
      placeholder: An operator can open the downloaded file and find the audit events shown in the console.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other information, screenshots, or mockups here.
    validations:
      required: false
