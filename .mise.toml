# Every tool that the repo needs is pinned here. `mise install` installs them.

[tools]
bun = "1.3.14"
biome = "2.5.0"
lefthook = "2.1.9"
cocogitto = "7.0.0"
gitleaks = "8.30.1"

[tasks.install]
description = "Install the locked dependencies"
run = "bun install --frozen-lockfile"

[tasks.setup]
description = "Install dependencies and git hooks"
depends = ["install"]
run = "lefthook install"

[tasks.dev]
description = "Run the app and reload on change"
run = "bun --watch run src/index.ts"

[tasks.start]
description = "Run the app"
run = "bun run src/index.ts"

[tasks.test]
description = "Run the tests"
run = "bun test"

[tasks."lint:ts"]
description = "Biome (warnings fail) and the TypeScript compiler"
run = ["biome check --error-on-warnings .", "bun run tsc --noEmit"]

[tasks."lint:secrets"]
description = "Scan the working tree for committed secrets"
run = "gitleaks dir . --no-banner"

[tasks.lint]
description = "Every linter"
depends = ["lint:ts", "lint:secrets"]

[tasks.format]
description = "Apply Biome's fixes"
run = "biome check . --write"

[tasks.check]
description = "The gate: run it before you finish a change"
run = ["mise run lint", "mise run test"]

[tasks.ci]
description = "Run exactly what CI runs. The pre-push hook and the CI workflow call it"
run = ["mise run install", "mise run check"]
