# The secret scan for `just lint` and the pre-commit hook. It extends the default gitleaks rule set and does not replace it.

[extend]
useDefault = true

# `just lint-secrets` scans the working tree, so it also reads what git ignores. These paths are
# build output, installed dependencies, and lock files with integrity hashes. An entry for any
# other path hides the defect that this scan looks for.
[allowlist]
paths = [
  '''(^|/)node_modules/''',
  '''^\.next/''',
  '''^\.venv/''',
  '''^\.direnv/''',
  '''^bin/''',
  '''^result(-.*)?$''',
  '''^bun\.lock$''',
  '''^bun\.nix$''',
  '''^uv\.lock$''',
]
