# Git hooks. `mise run setup` installs them.
# Every command runs through mise because a git hook has no active mise shell,
# and `lefthook:` makes the hook scripts find lefthook itself the same way.
lefthook: mise x -- lefthook

commit-msg:
  commands:
    cog:
      run: mise x -- cog verify --file {1}

pre-commit:
  piped: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json,jsonc}"
      run: mise x -- biome check --write --error-on-warnings --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    types:
      glob: "*.{ts,tsx}"
      run: mise x -- bun run tsc --noEmit
    test:
      glob: "*.{ts,tsx}"
      run: mise run test
    markdown:
      glob: "*.md"
      run: mise x -- rumdl check {staged_files}
    secrets:
      run: mise x -- gitleaks git --pre-commit --staged --no-banner

# The full CI run, so a push never reaches CI untested. `git push --no-verify` skips it.
pre-push:
  commands:
    cog:
      # Only the commits that this push adds. Older history, such as the first commit
      # that GitHub writes for a repo made from a template, can predate the convention.
      run: mise x -- cog check origin/master..HEAD
    ci:
      run: mise run ci
